version: '3.8'

services:
  # 1. Database Service
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data # Saves data so it survives restarts
    environment:
      - POSTGRES_USER=smarttrade_user
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=smarttrade_db
    ports:
      - "5432:5432"

  # 2. Backend Service
  backend:
    build: ./trading-bot-backend
    volumes:
      - ./trading-bot-backend:/app # Syncs your code edits instantly (Hot Reload)
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://smarttrade_user:password123@db:5432/smarttrade_db
    depends_on:
      - db

  # 3. Frontend Service
  frontend:
    build: ./trading-bot
    volumes:
      - ./trading-bot:/app
      - /app/node_modules # Prevents host node_modules from breaking container
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: