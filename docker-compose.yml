version: '3.8'

services:
  # Database
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=smarttrade_user
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=smarttrade_db
    ports:
      - "5432:5432"

  # Backend API (Python)
  backend:
    build: ./trading-bot-backend
    volumes:
      - ./trading-bot-backend:/app
    ports:
      - "10152:8000"  # <--- CRITICAL FIX: External 10152 -> Internal 8000
    environment:
      - DATABASE_URL=postgresql://smarttrade_user:password123@db:5432/smarttrade_db
    depends_on:
      - db

  # Frontend UI (React)
  frontend:
    build: ./trading-bot
    volumes:
      - ./trading-bot:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:10152  # <--- CRITICAL FIX: Matches the port above
      - CHOKIDAR_USEPOLLING=true # Essential for Windows hot-reloading
    depends_on:
      - backend

volumes:
  postgres_data: